<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Universo Eres Tú ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Playfair Display', serif;
            background: radial-gradient(circle at center, #1a0033, #0a001f, #000);
            color: #ffe6f0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nebula {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 25% 15%, rgba(255, 80, 180, 0.22) 0%, transparent 55%),
                        radial-gradient(circle at 75% 65%, rgba(80, 140, 255, 0.18) 0%, transparent 60%),
                        radial-gradient(circle at 35% 75%, rgba(255, 180, 80, 0.15) 0%, transparent 55%);
            animation: nebulaMove 45s linear infinite;
            pointer-events: none; z-index: 1;
        }
        @keyframes nebulaMove { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(60px, -50px) rotate(12deg); } }

        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        .container { text-align: center; z-index: 10; position: relative; padding: 15px; }

        .solar-system {
            position: relative;
            width: 100%;
            max-width: 560px;
            height: 560px;
            margin: 0 auto 25px;
        }

        .center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 32vw; max-width: 165px; height: 32vw; max-height: 165px;
            border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 90px #ff69b4, 0 0 180px rgba(255, 105, 180, 0.85);
            animation: pulse 4.5s infinite ease-in-out; z-index: 15;
        }
        .center img { width: 100%; height: 100%; object-fit: cover; }

        .orbit {
            position: absolute; top: 50%; left: 50%;
            border: 1px solid rgba(255, 105, 180, 0.18);
            border-radius: 50%; transform: translate(-50%, -50%);
            animation: rotate linear infinite;
        }

        .planet {
            position: absolute; border-radius: 50%;
            box-shadow: inset 20px 20px 30px rgba(0,0,0,0.6), 0 0 40px rgba(255, 105, 180, 0.6);
            animation: planetGlow 6s infinite alternate; overflow: hidden;
        }

        /* Planetas con tamaños relativos */
        .planet1 { width: 13.5vw; height: 13.5vw; max-width: 72px; max-height: 72px; background: radial-gradient(circle at 35% 35%, #ff8ac4, #c71585); }
        .planet2 { width: 11vw; height: 11vw; max-width: 58px; max-height: 58px; background: radial-gradient(circle at 45% 30%, #d8b4ff, #6b2fd1); }
        .planet3 { width: 12.8vw; height: 12.8vw; max-width: 68px; max-height: 68px; background: radial-gradient(circle at 50% 40%, #7ed6ff, #1e4d9e); }
        .planet4 { width: 10.5vw; height: 10.5vw; max-width: 55px; max-height: 55px; background: radial-gradient(circle at 40% 40%, #ffe066, #ffaa00); }
        .planet5 { width: 12vw; height: 12vw; max-width: 63px; max-height: 63px; background: radial-gradient(circle at 45% 35%, #7fffd4, #2e8b57); }
        .planet6 { width: 9.2vw; height: 9.2vw; max-width: 48px; max-height: 48px; background: radial-gradient(circle at 50% 45%, #ff7f7f, #b22222); }
        .planet7 { width: 15.5vw; height: 15.5vw; max-width: 82px; max-height: 82px; background: linear-gradient(135deg, #d2a679 20%, #b8860b 50%, #d2a679 80%); }

        .planet4::after {
            content: ''; position: absolute; width: 170%; height: 28%;
            background: linear-gradient(transparent, rgba(255,220,100,0.7), transparent);
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(28deg);
            box-shadow: 0 0 25px #ffdd66;
        }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.07); } }
        @keyframes planetGlow { from { filter: brightness(1) drop-shadow(0 0 12px); } to { filter: brightness(1.4) drop-shadow(0 0 35px); } }

        h2 { 
            font-size: clamp(2.2rem, 8vw, 3.1rem); 
            margin: 15px 0; color: #ff69b4; 
            text-shadow: 0 0 45px #ff1493; 
        }

        .message { 
            max-width: 580px; 
            font-size: clamp(1.1rem, 4.5vw, 1.42rem); 
            line-height: 1.8; 
            margin: 20px auto; 
            padding: 0 20px; 
        }

        button {
            background: linear-gradient(45deg, #ff1493, #ff69b4); color: white; border: none;
            padding: 16px 45px; font-size: clamp(1.2rem, 5vw, 1.45rem);
            border-radius: 50px; cursor: pointer; margin-top: 20px;
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.6); transition: all 0.4s;
        }
        button:hover { transform: scale(1.12) translateY(-8px); }

        .floating-message { 
            position: absolute; color: #ff99cc; font-family: 'Dancing Script', cursive; 
            font-size: clamp(1.4rem, 5vw, 1.75rem); text-shadow: 0 0 18px #ff1493; 
            pointer-events: none; z-index: 20; animation: floatUp 9s linear forwards; 
        }

        @keyframes floatUp { 
            0% { opacity: 0; transform: translateY(100px) scale(0.6); } 
            25% { opacity: 1; } 75% { opacity: 1; } 
            100% { opacity: 0; transform: translateY(-480px) scale(1.25); } 
        }

        .shooting-star { 
            position: absolute; height: 5px; 
            background: linear-gradient(to right, transparent, #ffffff, #ffccff);
            box-shadow: 0 0 30px #fff, 0 0 60px #ff69b4;
            animation: shoot 2.8s linear forwards; z-index: 5; 
        }

        #musicInfo {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,20,147,0.35); color: #ff99cc;
            padding: 8px 16px; border-radius: 30px; font-size: 0.95rem;
            z-index: 100; backdrop-filter: blur(8px);
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .solar-system { height: 480px; }
            .planet4::after { width: 160%; height: 25%; }
        }
    </style>
</head>
<body>
    <div class="nebula"></div>
    <div class="stars" id="stars"></div>

    <audio id="bgMusic" loop autoplay>
        <source src="./mp3/Para Morir Iguales ((Cover Audio)(Video)).mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <div id="musicInfo">♪ Para Morir Iguales ❤️</div>

    <div class="container">
        <div class="solar-system" id="system">
            <div class="center">
                <img src="./img/71547295-41c0-4fab-a539-9b22dfacb9d7.jfif" alt="Mi amor">
            </div>

            <!-- Órbitas y Planetas -->
            <div class="orbit" style="width: 42vw; height: 42vw; max-width: 230px; max-height: 230px; animation-duration: 12s;">
                <div class="planet planet1" style="top: -32px; left: 50%; transform: translateX(-50%);"></div>
            </div>
            <div class="orbit" style="width: 54vw; height: 54vw; max-width: 300px; max-height: 300px; animation-duration: 19s;">
                <div class="planet planet7" style="top: 20%; right: -18px;"></div>
            </div>
            <div class="orbit" style="width: 47vw; height: 47vw; max-width: 260px; max-height: 260px; animation-duration: 15s;">
                <div class="planet planet3" style="bottom: -28px; left: 50%; transform: translateX(-50%);"></div>
            </div>
            <div class="orbit" style="width: 68vw; height: 68vw; max-width: 380px; max-height: 380px; animation-duration: 28s;">
                <div class="planet planet4" style="top: 35%; left: -28px;"></div>
            </div>
            <div class="orbit" style="width: 61vw; height: 61vw; max-width: 340px; max-height: 340px; animation-duration: 21s;">
                <div class="planet planet5" style="top: 62%; right: 8px;"></div>
            </div>
            <div class="orbit" style="width: 75vw; height: 75vw; max-width: 420px; max-height: 420px; animation-duration: 33s;">
                <div class="planet planet2" style="top: 45%; left: -35px;"></div>
            </div>
            <div class="orbit" style="width: 50vw; height: 50vw; max-width: 280px; max-height: 280px; animation-duration: 17s;">
                <div class="planet planet6" style="bottom: 15%; right: -20px;"></div>
            </div>
        </div>

        <h2>Mi Universo Completo</h2>
        <div class="message" id="message">
            Tú eres el centro de todo mi universo.<br>
            Cada estrella, cada planeta y cada latido giran solo por ti.
        </div>
        <button onclick="bigExplosion()">Enviar Todo Mi Amor</button>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const musicInfo = document.getElementById('musicInfo');
        music.volume = 0.45;

        function startMusic() {
            music.play().catch(() => {
                document.body.addEventListener('click', () => music.play(), { once: true });
            });
            musicInfo.style.display = "block";
        }

        window.addEventListener('load', startMusic);

        // === Resto del código JavaScript (sin cambios) ===
        function createStar() {
            const star = document.createElement('div');
            star.textContent = Math.random() > 0.6 ? '✦' : '★';
            star.style.position = 'absolute';
            star.style.color = 'white';
            star.style.opacity = Math.random() * 0.8 + 0.3;
            star.style.fontSize = Math.random() * 19 + 11 + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animation = `twinkle ${Math.random()*7 + 4}s infinite`;
            document.getElementById('stars').appendChild(star);
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes twinkle { 0%,100% {opacity:0.35} 50% {opacity:1} } @keyframes shoot { 0% { transform: translate(0,0); opacity: 1; width: 12px; } 100% { transform: translate(450px, -450px); opacity: 0; width: 240px; } }`;
        document.head.appendChild(style);

        for(let i = 0; i < 280; i++) createStar();

        function shootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            const length = Math.random() * 160 + 120;
            star.style.width = length + 'px';
            star.style.left = Math.random() * 82 + 'vw';
            star.style.top = Math.random() * 48 + 'vh';
            star.style.transform = `rotate(${Math.random() * 45 - 25}deg)`;
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 3600);
        }
        setInterval(shootingStar, 780);

        const messages = ["Te amo", "Mi vida", "Eres mi todo", "Siempre tuya", "Mi corazón", "Para siempre", "Mi universo", "Te adoro"];
        function createFloatingMessage() {
            const msg = document.createElement('div');
            msg.className = 'floating-message';
            msg.textContent = messages[Math.floor(Math.random() * messages.length)];
            msg.style.left = Math.random() * 88 + 'vw';
            msg.style.top = '78vh';
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 9800);
        }
        setInterval(createFloatingMessage, 1050);

        function bigExplosion() {
            const msg = document.getElementById('message');
            const original = msg.innerHTML;
            msg.style.opacity = '0';
            setTimeout(() => {
                msg.innerHTML = `¡TE AMO CON TODO MI UNIVERSO!<br><br>❤️💫🌌`;
                msg.style.opacity = '1';
            }, 500);

            for(let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.textContent = '❤️';
                    heart.style.position = 'fixed';
                    heart.style.fontSize = Math.random() * 3.4 + 2.2 + 'rem';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '100vh';
                    heart.style.zIndex = '100';
                    heart.style.transition = 'all 5.2s cubic-bezier(0.25, 0.1, 0.25, 1)';
                    document.body.appendChild(heart);
                    setTimeout(() => {
                        heart.style.transform = `translateY(-${window.innerHeight + 800}px) rotate(${Math.random()*2000 - 800}deg)`;
                        heart.style.opacity = '0';
                    }, 80);
                }, i * 12);
            }

            setTimeout(() => {
                msg.style.opacity = '0';
                setTimeout(() => { msg.innerHTML = original; msg.style.opacity = '1'; }, 700);
            }, 6500);
        }

        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.73) {
                const heart = document.createElement('div');
                heart.textContent = '💕';
                heart.style.position = 'fixed';
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                heart.style.fontSize = '2.4rem';
                heart.style.zIndex = '50';
                document.body.appendChild(heart);
                setTimeout(() => {
                    heart.style.transition = 'all 2.1s';
                    heart.style.transform = 'translateY(-190px) scale(0.1)';
                    heart.style.opacity = '0';
                }, 40);
                setTimeout(() => heart.remove(), 2400);
            }
        });

        document.getElementById('system').addEventListener('click', () => {
            for(let i = 0; i < 12; i++) setTimeout(shootingStar, i * 65);
        });

        for(let i = 0; i < 6; i++) setTimeout(createFloatingMessage, i * 450);
    </script>
</body>
</html>
